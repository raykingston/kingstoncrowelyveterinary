# Publishes the website (index.html + /site folder) to GitHub Pages every time changes are pushed to main.
name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Publish only the website: index.html, robots.txt, sitemap.xml (root) + site/ — never Requirements/.
      - name: Stage website files
        run: |
          mkdir -p _public
          cp index.html robots.txt sitemap.xml _public/
          cp -r site _public/site
          rm -f _public/site/README.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _public
      - id: deployment
        uses: actions/deploy-pages@v4
